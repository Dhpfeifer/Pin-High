<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1B6B45"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>Pin High</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  /* Layout: one yardage-book page per hole. Big condensed numerals on turf-tinted paper,
     everything within thumb reach, three tabs at the bottom (Hole, Card, Round). */
  --bg: #ECEFE6;
  --surface: #FBFCF8;
  --ink: #10231A;
  --muted: #566559;
  --line: #D2D9C9;
  --tint: #DCE6D4;
  --accent: #1B6B45;
  --accent-ink: #F4FAF6;
  --pin: #C13A22;
  --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1410; --surface: #122019; --ink: #E6EEE8; --muted: #8FA196; --line: #233429;
    --tint: #1A2D22; --accent: #5ACB8B; --accent-ink: #06130C; --pin: #FF7C5E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1410; --surface: #122019; --ink: #E6EEE8; --muted: #8FA196; --line: #233429;
  --tint: #1A2D22; --accent: #5ACB8B; --accent-ink: #06130C; --pin: #FF7C5E;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 var(--f-body);
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; position: relative; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 6px; }
.top .meta { min-width: 0; }
.top .course { font: 600 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .date { font: 500 13px var(--f-body); color: var(--muted); }
.pill { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; font: 600 13px var(--f-body); padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.pill.live .dot { background: var(--accent); }
.pill.blocked .dot, .pill.unsupported .dot { background: var(--pin); }
.pill.searching .dot { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.searching .dot { animation: none; } }

main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-block: 6px 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.lbl { font: 600 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.small { font: 500 14px/1.35 var(--f-body); color: var(--muted); margin: 0; }
h2 { font: 700 22px/1.1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0 0 10px; }

.btn { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 16px var(--f-body); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn.marked { background: var(--tint); border-color: var(--accent); color: var(--accent); }
.btn.danger { border-color: var(--pin); color: var(--pin); }
.btn.ghost { background: transparent; }

/* hole header */
.holehead { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.nav { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font: 600 30px/1 var(--f-display); }
.holeid { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.holeid .num { font: 700 68px/.92 var(--f-display); }
.holeid .meta { font: 500 15px var(--f-body); color: var(--muted); margin-top: 4px; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 600 17px var(--f-display); }
.chip.done { background: var(--tint); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* GPS distances */
.dists { display: grid; grid-template-columns: 1fr 1.6fr 1fr; align-items: end; gap: 8px; text-align: center; }
.d { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.d .v { font: 700 46px/.95 var(--f-display); }
.d.main .v { font-size: 88px; color: var(--accent); }
.d .u { font: 600 13px var(--f-body); color: var(--muted); letter-spacing: .08em; }
.gstat { margin: 12px 0 0; text-align: center; font: 500 14px/1.35 var(--f-body); color: var(--muted); min-height: 1.4em; }
.gretry { margin-top: 10px; width: 100%; }
.markrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.markrow .lbl { flex: 1 0 100%; }
.markrow .btn { flex: 1 1 0; }

/* shot tracker */
.shotrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.shotrow .sv { font: 700 44px/1 var(--f-display); margin: 2px 0 4px; }
.shotrow .sv .u { font: 600 13px var(--f-body); color: var(--muted); margin-left: 4px; letter-spacing: .08em; }
.shotrow .col { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }

/* score entry */
.score { display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 64px 60px 1fr 60px; align-items: center; gap: 10px; }
.stepbtn { height: 60px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font: 600 32px/1 var(--f-display); }
.stepbtn:active { background: var(--tint); }
.val { display: flex; align-items: center; justify-content: center; font: 700 54px/1 var(--f-display); min-height: 64px; }
.rel { margin: 0; text-align: center; font: 600 15px var(--f-body); color: var(--muted); }

/* scorecard marks: circle birdie, double circle eagle, square bogey, double square double+ */
.mk { display: inline-flex; align-items: center; justify-content: center; min-width: 1.45em; height: 1.45em; padding: 0 .1em; margin: 6px; }
.m-birdie, .m-eagle { border: 2px solid currentColor; border-radius: 50%; }
.m-eagle { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }
.m-bogey, .m-double { border: 2px solid currentColor; border-radius: 3px; }
.m-double { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }

/* card tab */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 6px; }
.summary .n { font: 700 40px/1 var(--f-display); margin-top: 4px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font: 500 16px var(--f-body); }
th { font: 600 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 8px 4px; }
td { text-align: center; padding: 2px 4px; height: 46px; border-top: 1px solid var(--line); }
td.hn { width: 52px; }
.linkbtn { width: 40px; height: 36px; border-radius: 8px; border: 0; background: transparent; font: 700 20px var(--f-display); }
tr.cur td { background: var(--tint); }
tr.sub td { font-weight: 600; background: var(--bg); }
td.sc { font: 700 22px var(--f-display); }

/* round tab */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
input, select { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.hrow { display: grid; grid-template-columns: 30px 70px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-block: 6px; border-top: 1px solid var(--line); }
.hrow .hn { font: 700 20px var(--f-display); text-align: center; }
.hrow select, .hrow input { min-height: 44px; padding: 0 8px; }
.marks { display: flex; gap: 4px; }
.mchip { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: 700 14px var(--f-display); }
.mchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hist { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
.hist .t { font: 600 16px var(--f-body); }
.hist .s { font: 700 28px/1 var(--f-display); text-align: right; }
.hist .r { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-block: 8px 8px; border-top: 1px solid var(--line); }
.tabs button { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font: 600 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--tint); }

.toast { position: absolute; left: 0; right: 0; bottom: 78px; margin-inline: auto; width: max-content; max-width: calc(100% - 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font: 600 14px var(--f-body); text-align: center; z-index: 5; }
</style>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>
(function () {
  'use strict';
  const KEY = 'pinhigh.v1';
  const PARS = [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 3, 4, 5, 4, 4, 3, 4, 5];
  const YD = 1.0936133;

  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const pad = n => String(n).padStart(2, '0');
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const fmtDate = iso => { const p = String(iso).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
  const fmtRel = n => n === 0 ? 'E' : (n > 0 ? '+' : '−') + Math.abs(n);

  /* ---------- data ---------- */
  function mkCourse(name) {
    return { id: uid(), name: name, holes: PARS.map(p => ({ par: p, yds: null, f: null, c: null, b: null })) };
  }
  function mkRound(cid) {
    return { id: uid(), cid: cid, date: today(), hole: 0, s: Array(18).fill(null), p: Array(18).fill(null) };
  }
  function fresh() {
    const c = mkCourse('My Course');
    return { v: 1, updatedAt: 0, courses: [c], round: mkRound(c.id), history: [] };
  }
  function valid(s) {
    return !!(s && Array.isArray(s.courses) && s.courses.length && s.round && Array.isArray(s.round.s) && s.round.s.length === 18 &&
      Array.isArray(s.round.p) && s.round.p.length === 18 && Array.isArray(s.history) &&
      s.courses.every(c => c && Array.isArray(c.holes) && c.holes.length === 18));
  }
  function loadLocal() {
    try { const t = localStorage.getItem(KEY); if (!t) return null; const s = JSON.parse(t); return valid(s) ? s : null; } catch (e) { return null; }
  }
  let S = loadLocal() || fresh();
  const ui = { tab: 'hole', armed: null, shot: null };

  function course() { return S.courses.find(c => c.id === S.round.cid) || S.courses[0]; }
  function fixRound() {
    if (!S.courses.some(c => c.id === S.round.cid)) S.round.cid = S.courses[0].id;
    S.round.hole = Math.max(0, Math.min(17, S.round.hole | 0));
  }
  fixRound();

  /* ---------- saving: this phone first, your account when available ---------- */
  const remote = { doc: null, state: 'local', timer: 0, busy: false, again: false };
  function save() {
    S.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    queueRemote();
  }
  function queueRemote() {
    if (!remote.doc) return;
    clearTimeout(remote.timer);
    remote.timer = setTimeout(pushRemote, 1200);
  }
  async function pushRemote() {
    if (!remote.doc) return;
    if (remote.busy) { remote.again = true; return; }
    remote.busy = true;
    try { await remote.doc.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }); remote.state = 'synced'; }
    catch (e) { remote.state = 'error'; }
    remote.busy = false;
    setSync();
    if (remote.again) { remote.again = false; queueRemote(); }
  }
  function setSync() {
    const el = $('#syncNote'); if (!el) return;
    el.textContent = !remote.doc ? 'Saved on this phone.' :
      remote.state === 'error' ? 'Could not reach your account just now. Scores are still saved on this phone.' :
      'Saved on this phone and backed up to your account.';
  }
  async function initRemote() {
    try {
      if (!(window.claude && window.claude.use)) return;
      const both = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const db = both[0], user = both[1];
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const doc = db.doc('data/users/' + id + '/golf');
      const snap = await doc.get();
      remote.doc = doc; remote.state = 'synced';
      let rs = null;
      if (snap.exists) { try { rs = JSON.parse((snap.data() || {}).state); } catch (e) {} }
      if (valid(rs) && (rs.updatedAt || 0) > (S.updatedAt || 0)) {
        S = rs; fixRound();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        render();
      } else if (S.updatedAt && !(valid(rs) && rs.updatedAt === S.updatedAt)) {
        pushRemote();
      }
      setSync();
    } catch (e) {}
  }

  /* ---------- GPS ---------- */
  const gps = { pos: null, acc: null, status: 'searching', id: null };
  function startGps() {
    if (!('geolocation' in navigator)) { gps.status = 'unsupported'; updateLive(); return; }
    try {
      if (gps.id != null) navigator.geolocation.clearWatch(gps.id);
      gps.status = gps.pos ? 'live' : 'searching';
      gps.id = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    } catch (e) { gps.status = 'blocked'; }
    updateLive();
  }
  function onPos(p) {
    gps.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    gps.acc = p.coords.accuracy;
    gps.status = 'live';
    updateLive();
  }
  function onErr(e) {
    if (e && e.code === 1) { gps.status = 'blocked'; if (gps.id != null) { try { navigator.geolocation.clearWatch(gps.id); } catch (x) {} gps.id = null; } }
    else if (e && e.code === 2) { gps.status = gps.pos ? 'live' : 'searching'; }
    else if (!gps.pos) { gps.status = 'searching'; }
    updateLive();
  }
  function dist(a, b) {
    const R = 6371000, t = Math.PI / 180;
    const dLa = (b.lat - a.lat) * t, dLo = (b.lng - a.lng) * t;
    const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x)) * YD;
  }
  function holeDists(i) {
    const h = course().holes[i], o = { f: null, c: null, b: null };
    if (!gps.pos) return o;
    ['f', 'c', 'b'].forEach(k => { if (h[k]) o[k] = Math.round(dist(gps.pos, h[k])); });
    return o;
  }
  const fmtD = v => (v == null || v > 9999) ? '–' : String(v);

  function pillText() {
    return gps.status === 'live' && gps.acc != null ? 'GPS ±' + Math.round(gps.acc * YD) + ' yd' :
      gps.status === 'blocked' ? 'GPS off' : gps.status === 'unsupported' ? 'No GPS' : 'Finding GPS';
  }
  function statText(o) {
    const h = course().holes[S.round.hole];
    if (gps.status === 'blocked') return 'Location is blocked, so distances cannot update. Allow location for this page, then try again.';
    if (gps.status === 'unsupported') return 'This browser cannot read your location.';
    if (!gps.pos) return 'Looking for a GPS fix. It can take a few seconds outdoors.';
    if (!h.f && !h.c && !h.b) return 'This green is not marked yet. Mark it once when you are standing on it and it stays saved for every round.';
    return 'Distances update as you walk. Tee yardages come from your course setup.';
  }
  function updateLive() {
    const pill = $('#gpsPill');
    if (pill) { pill.className = 'pill ' + gps.status; $('.t', pill).textContent = pillText(); }
    if (ui.tab !== 'hole') return;
    const o = holeDists(S.round.hole);
    const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    set('#d-f', fmtD(o.f)); set('#d-c', fmtD(o.c)); set('#d-b', fmtD(o.b));
    set('#gstat', statText(o));
    set('#shotd', ui.shot && gps.pos ? fmtD(Math.round(dist(ui.shot, gps.pos))) : '–');
    const rt = $('#gpsRetry'); if (rt) rt.hidden = gps.status !== 'blocked';
  }

  /* ---------- scoring ---------- */
  function sum(r, c, a, b) {
    let tot = 0, par = 0, parAll = 0, putts = 0, n = 0, pn = 0, yds = 0, ydn = 0;
    for (let i = a; i < b; i++) {
      const h = c.holes[i];
      parAll += h.par;
      if (h.yds) { yds += h.yds; ydn++; }
      if (r.s[i] != null) { tot += r.s[i]; par += h.par; n++; }
      if (r.p[i] != null) { putts += r.p[i]; pn++; }
    }
    return { tot, par, parAll, putts, n, pn, yds, ydAll: ydn === b - a, rel: tot - par };
  }
  function label(s, par) {
    if (s == null) return '';
    if (s === 1) return 'Hole in one';
    const d = s - par;
    return d <= -3 ? 'Albatross' : d === -2 ? 'Eagle' : d === -1 ? 'Birdie' : d === 0 ? 'Par' : d === 1 ? 'Bogey' : d === 2 ? 'Double bogey' : fmtRel(d);
  }
  function cls(s, par) {
    if (s == null) return '';
    const d = s - par;
    return d <= -2 ? 'm-eagle' : d === -1 ? 'm-birdie' : d === 0 ? '' : d === 1 ? 'm-bogey' : 'm-double';
  }
  const mk = (s, par) => s == null ? '' : '<span class="mk ' + cls(s, par) + '">' + s + '</span>';

  function stepScore(d) {
    const r = S.round, i = r.hole, par = course().holes[i].par;
    let v = r.s[i];
    v = v == null ? par : Math.max(1, Math.min(15, v + d));
    r.s[i] = v;
    if (r.p[i] != null && r.p[i] > v) r.p[i] = v;
    save(); render();
  }
  function stepPutts(d) {
    const r = S.round, i = r.hole, max = r.s[i] != null ? r.s[i] : 9;
    let v = r.p[i];
    v = v == null ? Math.min(2, max) : Math.max(0, Math.min(max, v + d));
    r.p[i] = v;
    save(); render();
  }
  function go(n) {
    S.round.hole = Math.max(0, Math.min(17, n));
    ui.shot = null;
    save(); render();
  }

  /* ---------- views ---------- */
  const ICONS = {
    hole: '<path d="M7 21V3"/><path d="M7 4l11 4-11 4"/><path d="M4 21h8"/>',
    card: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    round: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
  };
  function renderTabs() {
    $('#tabs').innerHTML = [['hole', 'Hole'], ['card', 'Card'], ['round', 'Round']].map(t =>
      '<button data-a="tab" data-t="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' +
      '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[t[0]] + '</svg>' + t[1] + '</button>').join('');
  }
  function renderHeader() {
    $('#top').innerHTML =
      '<div class="meta"><div class="course">' + esc(course().name) + '</div><div class="date">' + fmtDate(S.round.date) + '</div></div>' +
      '<div class="pill ' + gps.status + '" id="gpsPill"><span class="dot"></span><span class="t">' + pillText() + '</span></div>';
  }

  function renderHole() {
    const r = S.round, c = course(), i = r.hole, h = c.holes[i];
    const s = r.s[i], p = r.p[i], t = sum(r, c, 0, 18);
    const o = holeDists(i);
    const chips = c.holes.map((_, k) =>
      '<button class="chip' + (k === i ? ' on' : '') + (r.s[k] != null ? ' done' : '') + '" data-a="goto" data-i="' + k + '" aria-label="Hole ' + (k + 1) + (r.s[k] != null ? ', scored ' + r.s[k] : '') + '"' + (k === i ? ' aria-current="true"' : '') + '>' + (k + 1) + '</button>').join('');
    const mkBtn = (k, l) => '<button class="btn small' + (h[k] ? ' marked' : '') + '" data-a="mark" data-k="' + k + '" aria-label="Mark ' + l.toLowerCase() + ' of the green at my position">' + l + (h[k] ? ' ✓' : '') + '</button>';
    const relLine = (s == null ? 'Tap + to enter your score. The first tap sets par.' : label(s, h.par)) + (t.n ? ' · Round ' + fmtRel(t.rel) + ' through ' + t.n : '');
    return '' +
      '<section class="holehead">' +
        '<button class="nav" data-a="prev" aria-label="Previous hole"' + (i === 0 ? ' disabled' : '') + '>‹</button>' +
        '<div class="holeid"><span class="lbl">Hole</span><span class="num">' + (i + 1) + '</span><span class="meta">Par ' + h.par + (h.yds ? ' · ' + h.yds + ' yd' : '') + '</span></div>' +
        '<button class="nav" data-a="next" aria-label="Next hole"' + (i === 17 ? ' disabled' : '') + '>›</button>' +
      '</section>' +
      '<div class="strip" id="strip">' + chips + '</div>' +
      '<section class="card">' +
        '<div class="dists">' +
          '<div class="d"><span class="lbl">Front</span><span class="v" id="d-f">' + fmtD(o.f) + '</span></div>' +
          '<div class="d main"><span class="lbl">Center</span><span class="v" id="d-c">' + fmtD(o.c) + '</span><span class="u">YARDS</span></div>' +
          '<div class="d"><span class="lbl">Back</span><span class="v" id="d-b">' + fmtD(o.b) + '</span></div>' +
        '</div>' +
        '<p class="gstat" id="gstat">' + esc(statText(o)) + '</p>' +
        '<button class="btn small gretry" id="gpsRetry" data-a="gps"' + (gps.status === 'blocked' ? '' : ' hidden') + '>Allow location</button>' +
        '<div class="markrow"><span class="lbl">Stand on the green, then mark</span>' + mkBtn('f', 'Front') + mkBtn('c', 'Center') + mkBtn('b', 'Back') + '</div>' +
      '</section>' +
      '<section class="card shotrow">' +
        '<div><span class="lbl">Shot distance</span><div class="sv"><span id="shotd">' + (ui.shot && gps.pos ? fmtD(Math.round(dist(ui.shot, gps.pos))) : '–') + '</span><span class="u">YD</span></div>' +
        '<p class="small">Mark where the ball sits, hit, then walk to it.</p></div>' +
        '<div class="col"><button class="btn" data-a="shot">' + (ui.shot ? 'Re-mark' : 'Mark shot') + '</button>' + (ui.shot ? '<button class="btn ghost" data-a="shotclear">Clear</button>' : '') + '</div>' +
      '</section>' +
      '<section class="card score">' +
        '<div class="step"><span class="lbl">Score</span><button class="stepbtn" data-a="s-" aria-label="One less stroke">−</button><output class="val" aria-live="polite">' + (s == null ? '–' : mk(s, h.par)) + '</output><button class="stepbtn" data-a="s+" aria-label="One more stroke">+</button></div>' +
        '<div class="step"><span class="lbl">Putts</span><button class="stepbtn" data-a="p-" aria-label="One less putt">−</button><output class="val" aria-live="polite">' + (p == null ? '–' : p) + '</output><button class="stepbtn" data-a="p+" aria-label="One more putt">+</button></div>' +
        '<p class="rel">' + esc(relLine) + '</p>' +
      '</section>' +
      '<button class="btn primary" data-a="advance">' + (i < 17 ? 'Next hole' : 'See scorecard') + '</button>';
  }

  function renderCard() {
    const r = S.round, c = course(), t = sum(r, c, 0, 18), cur = r.hole;
    const row = i => {
      const h = c.holes[i];
      return '<tr' + (i === cur ? ' class="cur"' : '') + '><td class="hn"><button class="linkbtn" data-a="goto" data-i="' + i + '" aria-label="Go to hole ' + (i + 1) + '">' + (i + 1) + '</button></td>' +
        '<td>' + h.par + '</td><td>' + (h.yds || '') + '</td><td class="sc">' + mk(r.s[i], h.par) + '</td><td>' + (r.p[i] != null ? r.p[i] : '') + '</td></tr>';
    };
    const subRow = (name, a, b) => {
      const g = sum(r, c, a, b);
      return '<tr class="sub"><td>' + name + '</td><td>' + g.parAll + '</td><td>' + (g.ydAll ? g.yds : '') + '</td><td class="sc">' + (g.n ? g.tot : '') + '</td><td>' + (g.pn ? g.putts : '') + '</td></tr>';
    };
    let body = '';
    for (let i = 0; i < 9; i++) body += row(i);
    body += subRow('Out', 0, 9);
    for (let i = 9; i < 18; i++) body += row(i);
    body += subRow('In', 9, 18) + subRow('Tot', 0, 18);
    return '' +
      '<section class="card"><div class="summary">' +
        '<div><span class="lbl">Score</span><div class="n">' + (t.n ? t.tot : '–') + '</div></div>' +
        '<div><span class="lbl">To par</span><div class="n">' + (t.n ? fmtRel(t.rel) : '–') + '</div></div>' +
        '<div><span class="lbl">Holes</span><div class="n">' + t.n + '</div></div>' +
        '<div><span class="lbl">Putts</span><div class="n">' + (t.pn ? t.putts : '–') + '</div></div>' +
      '</div></section>' +
      '<section class="card"><div class="scroll"><table><thead><tr><th>Hole</th><th>Par</th><th>Yds</th><th>Score</th><th>Putts</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="small" style="margin-top:10px">Circle is a birdie, double circle an eagle, square a bogey, double square a double bogey or worse.</p></section>';
  }

  function renderRound() {
    const r = S.round, c = course();
    const locked = r.s.some(v => v != null);
    const t = sum(r, c, 0, 18);
    const opts = S.courses.map(k => '<option value="' + k.id + '"' + (k.id === r.cid ? ' selected' : '') + '>' + esc(k.name) + '</option>').join('');
    const holes = c.holes.map((h, i) => {
      const chip = (k, l, name) => '<button class="mchip' + (h[k] ? ' on' : '') + '" data-a="clearmark" data-i="' + i + '" data-k="' + k + '"' + (h[k] ? ' aria-label="Clear ' + name + ' mark for hole ' + (i + 1) + '"' : ' disabled aria-label="' + name + ' not marked for hole ' + (i + 1) + '"') + '>' + l + '</button>';
      return '<div class="hrow"><span class="hn">' + (i + 1) + '</span>' +
        '<select data-f="par" data-i="' + i + '" aria-label="Par for hole ' + (i + 1) + '">' + [3, 4, 5, 6].map(v => '<option value="' + v + '"' + (h.par === v ? ' selected' : '') + '>Par ' + v + '</option>').join('') + '</select>' +
        '<input type="number" inputmode="numeric" min="0" max="800" placeholder="Yards" data-f="yds" data-i="' + i + '" value="' + (h.yds || '') + '" aria-label="Tee yardage for hole ' + (i + 1) + '">' +
        '<div class="marks">' + chip('f', 'F', 'Front') + chip('c', 'C', 'Center') + chip('b', 'B', 'Back') + '</div></div>';
    }).join('');
    const hist = S.history.length ? S.history.map(h => {
      const key = 'delhist:' + h.id;
      return '<div class="hist"><div><div class="t">' + esc(h.course) + '</div><div class="small">' + fmtDate(h.date) + (h.n < 18 ? ' · ' + h.n + ' holes' : '') + (h.pn ? ' · ' + h.putts + ' putts' : '') + '</div></div>' +
        '<div class="s">' + h.total + ' <span class="small">' + fmtRel(h.total - h.par) + '</span></div>' +
        '<div class="r"><span></span><button class="btn small ghost' + (ui.armed === key ? ' danger' : '') + '" data-a="delhist" data-id="' + h.id + '">' + (ui.armed === key ? 'Tap again to remove' : 'Remove') + '</button></div></div>';
    }).join('') : '<p class="small">Finished rounds show up here.</p>';
    return '' +
      '<section class="card"><h2>This round</h2>' +
        '<div class="field"><label class="lbl" for="courseSel">Course</label><select id="courseSel" data-f="course"' + (locked ? ' disabled' : '') + '>' + opts + '</select></div>' +
        '<div class="field"><label class="lbl" for="courseName">Course name</label><input id="courseName" data-f="cname" value="' + esc(c.name) + '" maxlength="60" autocomplete="off"></div>' +
        (locked ? '<p class="small" style="margin-bottom:12px">Scores are entered, so the course is locked until you finish or reset this round.</p>' : '') +
        '<div class="row"><button class="btn primary" data-a="finish"' + (t.n ? '' : ' disabled') + '>Finish and save round</button>' +
        '<button class="btn' + (ui.armed === 'reset' ? ' danger' : '') + '" data-a="reset"' + (t.n ? '' : ' disabled') + '>' + (ui.armed === 'reset' ? 'Tap again to clear scores' : 'Reset scores') + '</button>' +
        '<button class="btn" data-a="newcourse">Add a course</button></div>' +
      '</section>' +
      '<section class="card"><h2>Holes and greens</h2><p class="small" style="margin-bottom:8px">Set par and tee yardage from the course card. The F, C and B chips show which green points you have marked. Tap a lit chip to clear it.</p>' + holes + '</section>' +
      '<section class="card"><h2>Past rounds</h2>' + hist + '</section>' +
      '<p class="small" id="syncNote" style="text-align:center"></p>';
  }

  function render() {
    const f = document.activeElement;
    const keep = f && f.dataset && f.dataset.a ? { a: f.dataset.a, k: f.dataset.k, i: f.dataset.i, t: f.dataset.t } : null;
    renderHeader(); renderTabs();
    $('#view').innerHTML = ui.tab === 'hole' ? renderHole() : ui.tab === 'card' ? renderCard() : renderRound();
    if (ui.tab === 'hole') { const on = $('.chip.on'); if (on && on.scrollIntoView) { try { on.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} } updateLive(); }
    if (ui.tab === 'round') setSync();
    if (keep) {
      let sel = '[data-a="' + keep.a + '"]';
      if (keep.k) sel += '[data-k="' + keep.k + '"]';
      if (keep.i != null && keep.a !== 'goto') sel += '[data-i="' + keep.i + '"]';
      if (keep.t) sel += '[data-t="' + keep.t + '"]';
      const n = $(sel); if (n && !n.disabled) { try { n.focus({ preventScroll: true }); } catch (e) {} }
    }
  }

  /* ---------- actions ---------- */
  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }
  function arm(key) {
    if (ui.armed === key) { ui.armed = null; return true; }
    ui.armed = key; render(); return false;
  }
  function markGreen(k) {
    if (!gps.pos) { toast(gps.status === 'blocked' ? 'Location is blocked, so there is nothing to mark.' : 'No GPS fix yet. Try again in a few seconds.'); return; }
    const h = course().holes[S.round.hole];
    h[k] = { lat: Math.round(gps.pos.lat * 1e6) / 1e6, lng: Math.round(gps.pos.lng * 1e6) / 1e6 };
    save(); render();
    const warn = gps.acc != null && gps.acc * YD > 25;
    toast((k === 'f' ? 'Front' : k === 'c' ? 'Center' : 'Back') + ' marked' + (warn ? '. Weak fix, mark again if you can.' : ''));
  }
  function finishRound() {
    const r = S.round, c = course(), t = sum(r, c, 0, 18);
    if (!t.n) { toast('Enter at least one score first.'); return; }
    S.history.unshift({ id: r.id, date: r.date, course: c.name, total: t.tot, par: t.par, n: t.n, putts: t.putts, pn: t.pn });
    S.history = S.history.slice(0, 200);
    S.round = mkRound(c.id); ui.tab = 'hole'; ui.shot = null;
    save(); render(); toast('Round saved. Fresh card ready.');
  }

  function act(a, el) {
    if (a !== 'reset' && a !== 'delhist') ui.armed = null;
    switch (a) {
      case 'tab': ui.tab = el.dataset.t; render(); $('#view').scrollTop = 0; break;
      case 'prev': go(S.round.hole - 1); break;
      case 'next': go(S.round.hole + 1); break;
      case 'goto': S.round.hole = +el.dataset.i; ui.tab = 'hole'; ui.shot = null; save(); render(); $('#view').scrollTop = 0; break;
      case 'advance': if (S.round.hole < 17) go(S.round.hole + 1); else { ui.tab = 'card'; render(); $('#view').scrollTop = 0; } break;
      case 'mark': markGreen(el.dataset.k); break;
      case 'clearmark': course().holes[+el.dataset.i][el.dataset.k] = null; save(); render(); break;
      case 'shot':
        if (!gps.pos) { toast(gps.status === 'blocked' ? 'Location is blocked.' : 'No GPS fix yet.'); break; }
        ui.shot = { lat: gps.pos.lat, lng: gps.pos.lng }; render(); toast('Shot marked. Walk to your ball.'); break;
      case 'shotclear': ui.shot = null; render(); break;
      case 's+': stepScore(1); break;
      case 's-': stepScore(-1); break;
      case 'p+': stepPutts(1); break;
      case 'p-': stepPutts(-1); break;
      case 'gps': startGps(); break;
      case 'finish': finishRound(); break;
      case 'reset':
        if (arm('reset')) { S.round.s = Array(18).fill(null); S.round.p = Array(18).fill(null); S.round.hole = 0; S.round.date = today(); ui.shot = null; save(); render(); toast('Scores cleared.'); }
        break;
      case 'delhist':
        if (arm('delhist:' + el.dataset.id)) { S.history = S.history.filter(h => h.id !== el.dataset.id); save(); render(); }
        break;
      case 'newcourse': {
        const nc = mkCourse('Course ' + (S.courses.length + 1));
        S.courses.push(nc);
        if (!S.round.s.some(v => v != null)) S.round.cid = nc.id;
        save(); render(); toast('Course added. Set pars and yardages below.'); break;
      }
    }
  }

  document.addEventListener('click', e => {
    const b = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!b || b.disabled) return;
    act(b.dataset.a, b);
  });
  document.addEventListener('change', e => {
    const el = e.target, f = el.dataset && el.dataset.f;
    if (!f) return;
    const c = course();
    if (f === 'course') { if (!S.round.s.some(v => v != null)) { S.round.cid = el.value; S.round.hole = 0; save(); render(); } }
    else if (f === 'cname') { c.name = el.value.trim() || 'Untitled course'; save(); renderHeader(); }
    else if (f === 'par') { c.holes[+el.dataset.i].par = +el.value; save(); render(); }
    else if (f === 'yds') { const v = parseInt(el.value, 10); c.holes[+el.dataset.i].yds = v > 0 ? Math.min(v, 800) : null; save(); }
  });

  /* keep the screen on while on the course */
  let wl = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wl) {
        wl = await navigator.wakeLock.request('screen');
        wl.addEventListener('release', () => { wl = null; });
      }
    } catch (e) {}
  }
  document.addEventListener('click', keepAwake, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  render();
  startGps();
  initRemote();
})();
</script>
</body></html>
